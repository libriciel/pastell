<VirtualHost *:80>
    ServerAdmin root@localhost
    ServerName ${MAILSEC_HOST}
    DocumentRoot /app/web-mailsec/

    Alias /.well-known/acme-challenge /acme-challenge/.well-known/acme-challenge
    <Directory /acme-challenge/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://${MAILSEC_HOST}:${HTTPS_PORT}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin root@localhost
    ServerName ${MAILSEC_HOST}
    DocumentRoot /app/web-mailsec/

    SSLEngine on
    SSLCertificateFile /data/certificates/mailsec/fullchain.pem
    SSLCertificateKeyFile /data/certificates/mailsec/privkey.pem

    ErrorLog /data/log/mailsec-error-ssl.log
    CustomLog /data/log/mailsec-access-ssl.log combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    # Forward a CONTENT_LENGTH to PHP-FPM even when the client sends a chunked
    # request body, otherwise PHP leaves $_POST and $_FILES empty.
    SetEnv proxy-sendcl 1

    <Directory /app/web-mailsec/>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
     </Directory>
</VirtualHost>