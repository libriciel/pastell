<VirtualHost *:80>
    ServerAdmin root@localhost
    ServerName ${APP_HOST}
    DocumentRoot /app/web/

    ErrorLog /data/log/pastell-error.log
    CustomLog /data/log/pastell-access combined

    Alias /.well-known/acme-challenge /acme-challenge/.well-known/acme-challenge
    <Directory /acme-challenge/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://${APP_HOST}:${HTTPS_PORT}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin root@localhost
    ServerName ${APP_HOST}
    DocumentRoot /app/web/

    SSLEngine on
    SSLCertificateFile /data/certificates/app/fullchain.pem
    SSLCertificateKeyFile /data/certificates/app/privkey.pem

    ErrorLog /data/log/pastell-error-ssl.log
    CustomLog /data/log/pastell-access-ssl.log combined

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000"
    </FilesMatch>

    <Directory /app/web/>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
     </Directory>

    ProxyPass "/bl-xemwebviewer" http://pes-viewer:8888/bl-xemwebviewer
    ProxyPassReverse "/bl-xemwebviewer" http://pes-viewer:8888/bl-xemwebviewer
</VirtualHost>