[supervisorctl]
serverurl=unix:///tmp/supervisor.sock ; use a unix:// URL  for a unix socket

[unix_http_server]
file=/tmp/supervisor.sock  ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/data/log/supervisord.log
childlogdir = /data/log/
pidfile=/tmp/supervisord.pid

[program:apache]
command=/usr/local/apache2/bin/httpd -DFOREGROUND
autostart=true
autorestart=true
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/data/log/apache2-stdout.log
stderr_logfile=/data/log/apache2-stderr.log

[program:supercronic]
command=/usr/bin/supercronic /data/crontab
autostart=true
autorestart=true
stdout_logfile=/data/log/supercronic-stdout.log
stderr_logfile=/data/log/supercronic-stderr.log