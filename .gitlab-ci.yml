include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  # FIXME: disabled because the qlty code-quality job uses too much memory, gets OOM-killed
  # by the runner and blocks the other jobs of the pipeline.
#  - component: $LIBRICIEL_CATALOG_PATH/qlty/code-quality@~latest
#    inputs:
#      mode: "changed"
  - component: $LIBRICIEL_CATALOG_PATH/renovate-runner/runner@1.6.1
  - component: $LIBRICIEL_CATALOG_PATH/software-release/publish-compose@3.2.0
  - component: $LIBRICIEL_CATALOG_PATH/sbom-manager/build@1.4.0
    inputs:
      compose_file: "docker/compose.yaml"
      version_placeholder: "canary"

stages:
    - build
    - static-analysis
    - test
    - quality
    - staging
    - deploy
    - publish

variables:
    CONTAINER_IMAGE_APP: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-app"
    CONTAINER_IMAGE_WEB: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-web"
    APK_PINNED_PACKAGES: ""
    DOCKER_BUILD_OPTS: ""
    DATABASE_HOST: mariadb
    DATABASE_NAME: pastell_test
    MYSQL_DATABASE: pastell_test
    MYSQL_USER: user
    DATABASE_USER: user
    MYSQL_PASSWORD: user
    DATABASE_PASSWORD: user
    DATABASE_PORT: 3306
    MYSQL_RANDOM_ROOT_PASSWORD: yes
    DATABASE_HOST_TEST: mariadb
    DATABASE_USER_TEST: user
    DATABASE_PASSWORD_TEST: user
    PHP_MEMORY_LIMIT: 1000M
    APP_HOST: localhost
    MAILSEC_HOST: 127.0.0.1
    HTTP_PORT: 80
    HTTPS_PORT: 443

build-app:
  stage: build
  tags:
    - docker-build
  variables:
    DOCKER_BUILDKIT: 1
    GITHUB_API_TOKEN: "${GITHUB_API_TOKEN}"
  script:
    - date=$(date)
    - sed -i "s/%CI_BUILD_ID%/${CI_PIPELINE_ID}/" ./manifest.yml
    - sed -i "s/%BUILD_DATE%/$date/" ./manifest.yml
    - sed -i "s/%VERSION%/${CI_COMMIT_REF_NAME}/" ./manifest.yml
    - sed -i "s/%GITHUB_API_TOKEN%/${GITHUB_API_TOKEN}/" ./docker/github/auth.json
    - docker build ${DOCKER_BUILD_OPTS} --build-arg APK_PINNED_PACKAGES="${APK_PINNED_PACKAGES}" --secret id=composer_auth,src=./docker/github/auth.json --target dev --pull -t ${CONTAINER_IMAGE_APP} -f docker/app/Dockerfile .
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker push ${CONTAINER_IMAGE_APP}

build-web:
  stage: build
  tags:
    - docker-build
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build ${DOCKER_BUILD_OPTS} --pull -t ${CONTAINER_IMAGE_WEB} -f docker/web/Dockerfile .
    - docker push ${CONTAINER_IMAGE_WEB}

lint:
  stage: static-analysis
  image : "$CONTAINER_IMAGE_APP"
  variables:
    DONT_INIT_DATABASE: "true"
  script:
    - cd /app
    - composer phpcs

phpstan:
  stage: static-analysis
  image : "$CONTAINER_IMAGE_APP"
  variables:
    DONT_INIT_DATABASE: "true"
  script:
    - cd /app
    - composer phpstan

#Note: il semble que le fichier entrypoint soit exécuté deux fois !
# https://gitlab.com/gitlab-org/gitlab-ci-multi-runner/issues/1380
# Ca permet de tester l'idempotence de fichier entrypoint, mais c'est pas super quand même

unit_test:
    stage: test
    image : "$CONTAINER_IMAGE_APP"
    variables:
      GIT_STRATEGY: none
      COMPOSER_PROCESS_TIMEOUT: 1200
    services:
        - name: hubdocker.libriciel.fr/mariadb:11.4.13-noble@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1
          alias: mariadb
    script:
        - cd /app
        - php -dpcov.enabled=1 -dpcov.directory=. vendor/bin/phpunit --coverage-text --colors=never --coverage-clover coverage/coverage.xml --coverage-cobertura coverage/cobertura.xml --log-junit coverage/logfile.xml
        - cp -rf coverage $CI_PROJECT_DIR
    coverage: '/^\s*Lines:\s*\d+.\d+\%/'
    artifacts:
        paths:
            - coverage
        reports:
          coverage_report:
            coverage_format: cobertura
            path: coverage/cobertura.xml
          junit: coverage/logfile.xml
        expire_in: 1h

quality:
  stage: quality
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG != null
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
  image:
    name: hubdocker.libriciel.fr/sonarsource/sonar-scanner-cli:12.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9
    entrypoint: [ "/bin/sh", "-c" ]
  script:
    - sonar-scanner -Dsonar.token=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST_URL

acceptance_test:
    stage: test
    image : "$CONTAINER_IMAGE_APP"
    variables:
        GIT_STRATEGY: none
        REDIS_SERVER: redis
        REDIS_PORT: 6379
        PACK_TEST: "true"
        APP_HOST: web
        FF_NETWORK_PER_BUILD: "true"
        DONT_INIT_DATABASE: "true"
    services:
        - name: hubdocker.libriciel.fr/mariadb:11.4.13-noble@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1
          alias: mariadb
        - name: hubdocker.libriciel.fr/redis:8.10.1-alpine3.23@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          alias: redis
        - name: ${CONTAINER_IMAGE_APP}
          alias: app
          command: [ "/bin/sh", "-c", "mkdir -p /builds/shared-workspace && cp -a /data/workspace/* /builds/shared-workspace && rm -r /data/workspace && ln -s /builds/shared-workspace /data/workspace && /usr/local/sbin/php-fpm --nodaemonize" ]
          variables:
            DONT_INIT_DATABASE: ""
        - name: ${CONTAINER_IMAGE_WEB}
          alias: web
    before_script:
      - mkdir -p /builds/shared-workspace
      - rm -r /data/workspace
      - ln -s /builds/shared-workspace /data/workspace
    script:
      - cd /app
      - mkdir -p test/codeception/tests/output
      - composer codecept || { cp -rf test/codeception/tests/output $CI_PROJECT_DIR; cp -rf /data/log $CI_PROJECT_DIR; exit 1; }
    artifacts:
        when: on_failure
        paths:
            - $CI_PROJECT_DIR
        expire_in: 1h

.security_scan_base:
  stage: test
  image:
    name: hubdocker.libriciel.fr/aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  services:
    - docker:dind@sha256:5efed980cba3fc126cf54e21a5a6ff8849d05b6e0623d6e7612f48e9cd6cd17e
  script:
    - apk add --no-cache curl docker-cli
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - trivy image --no-progress --skip-dirs "/app/documentation/data-exemple" --output scanning-report.txt $CONTAINER_IMAGE
    - trivy image --exit-code 1 --no-progress --skip-dirs "/app/documentation/data-exemple" --severity HIGH,CRITICAL $CONTAINER_IMAGE
  artifacts:
    reports:
      container_scanning: scanning-report.txt
    expire_in: 1 week

security_scan_app:
  allow_failure: true
  extends: .security_scan_base
  variables:
    CONTAINER_IMAGE: $CONTAINER_IMAGE_APP

security_scan_web:
  allow_failure: true
  extends: .security_scan_base
  variables:
    CONTAINER_IMAGE: $CONTAINER_IMAGE_WEB

publish-container-to-registry:
  stage: deploy
  tags:
    - docker-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG != null
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      variables:
        IMAGE_VERSION: 'canary'
  variables:
    IMAGE_VERSION: $CI_COMMIT_REF_NAME
    APP_IMAGE: ${REGISTRY_CONTAINER_HOST}${REGISTRY_CONTAINER_PATH}-app:$IMAGE_VERSION
    WEB_IMAGE: ${REGISTRY_CONTAINER_HOST}${REGISTRY_CONTAINER_PATH}-web:$IMAGE_VERSION
  before_script:
    - date=$(date)
    - sed -i "s/%CI_BUILD_ID%/${CI_PIPELINE_ID}/" ./manifest.yml
    - sed -i "s/%BUILD_DATE%/$date/" ./manifest.yml
    - sed -i "s/%VERSION%/${CI_COMMIT_REF_NAME}/" ./manifest.yml
  script:
    - docker login -u "$REGISTRY_CONTAINER_USER" -p "$REGISTRY_CONTAINER_PASSWORD" "$REGISTRY_CONTAINER_HOST"
    - docker build ${DOCKER_BUILD_OPTS} --build-arg APK_PINNED_PACKAGES="${APK_PINNED_PACKAGES}" --pull -t ${APP_IMAGE} -f docker/app/Dockerfile .
    - docker push ${APP_IMAGE}
    - docker build ${DOCKER_BUILD_OPTS} --pull -t ${WEB_IMAGE} -f docker/web/Dockerfile .
    - docker push ${WEB_IMAGE}

deploy_dev:
  needs: [ "publish-container-to-registry" ]
  allow_failure: true
  stage: deploy
  environment:
    name: pastell-4-0.dev.libriciel.net
    url: https://pastell-4-0.dev.libriciel.net
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG != null
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
  variables:
    PAYLOAD: "payload={\"text\": \"[pastell-4-0.dev.libriciel.net](https://pastell-4-0.dev.libriciel.net) a été mis à jour - [build $CI_PIPELINE_ID]($CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID)\"}"
  script:
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - scp ./docker/compose.yaml gitlab@pastell-4-0.dev.libriciel.net:/data/docker-file/docker-compose.yml
    - echo "$DEV_ENV_FILE_CONTENT" > /tmp/.env
    - scp /tmp/.env gitlab@pastell-4-0.dev.libriciel.net:/data/docker-file/
    - ssh -tt gitlab@pastell-4-0.dev.libriciel.net "docker login -u gitlab-ci-token -p '$CI_JOB_TOKEN' $CI_REGISTRY && cd /data/docker-file/ && docker-compose pull && docker-compose up -d"
    - curl -i -X POST -d "$PAYLOAD" $MATTERMOST_WEBHOOK

generate-sbom-compose:
  needs: [ "publish-container-to-registry"]

package-sbom-compose:
  needs: [ "generate-sbom-compose" ]

publish-compose:
  needs: [ "publish-container-to-registry", "package-sbom-compose" ]
  variables:
    COMPOSE_FILE_NAME: compose.yaml
  before_script:
    - sed -i "s/canary/${CI_COMMIT_REF_NAME}/" docker/compose.yaml

container_scanning:
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH-app