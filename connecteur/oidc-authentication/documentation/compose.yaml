services:
  keycloak:
    image: keycloak/keycloak:26.6@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_PASSWORD:-admin}
    volumes:
      - ./keycloak_pastell.json:/opt/keycloak/data/import/keycloak.json
    command:
      - 'start-dev'
      - '--import-realm'
    ports:
      - "9090:8080"

