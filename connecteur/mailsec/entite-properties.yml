nom: 'Mail sécurisé'
type: mailsec
description: 'Connecteur permettant de configurer le mail sécurisé pour une entité.'
formulaire:
    'Mail sécurisé':
        mailsec_from_description:
            name: "Nom de l'émetteur"
            commentaire: "Vous pouvez utiliser %ENTITE% (nom de l'entité)"
            default: PASTELL
        mailsec_reply_to:
            name: Reply-To
            commentaire: "Lors de l'envoi, prend la valeur de l'émetteur PLATEFORME_MAIL si non renseigné"
        mailsec_subject:
            name: 'Sujet du mail sécurisé'
            default: 'Vous avez reçu un mail sécurisé'
            commentaire: "Vous pouvez utiliser les mêmes méta-informations que le contenu du mail texte\npar le nom de l'entité et par le titre du dossier Pastell. Le libellé configuré pour la plateforme sera ajouté entre crochets au début de l’objet."
        content_html:
            name: 'Mail HTML'
            commentaire: "Un fichier HTML susceptible d'être envoyé par mail. Peut contenir les mêmes méta-informations que le contenu texte"
            type: file
        embeded_image:
            name: 'Images jointes'
            type: file
            multiple: true
            commentaire: "Fichier permettant de mettre des images et/ou des pièces jointes. Utiliser cid:imageXX dans le mail HTML avec XX le numéro de l'image (commence à 0)"
        mailsec_content:
            name: 'Contenu du mail texte'
            type: textarea
            commentaire: "Vous pouvez utiliser %ENTITE% (nom de l'entité), %TITRE% (titre du dossier Pastell), %LINK% (lien de récupération), %FLUX:element_du_flux% (élément du flux),\n%FLUX:@id_element_fichier_json:clé_i:clé_j:...:clé_n% (récupérer le contenu d'un fichier de type json)\nqui seront remplacés lors de l'envoi du mail"
            default: "Bonjour,\n\nLe serveur sécurisé Pastell de LIBRICIEL SCOP vous informe qu'un message recommandé mail\navec d'éventuelles pièces attachées vous a été posté.\n\nPour en prendre connaissance veuillez cliquer sur le lien suivant."
        nb_day_relance:
            name: 'Nombre de jour avant relance du mail securisé'
            commentaire: '30 jours si non renseigné'
        nb_day_next_state:
            name: 'Nombre de jour avant passage au prochain état du dossier'
            commentaire: '60 jours si non renseigné'
action:
    test:
        name: "Tester l'envoi à Reply-To"
        action-class: MailsecTest
