nom: 'asalae (Rest)'
description: 'Connecteur pour le SAE asalae de Libriciel'
type: SAE
allow_on_entite_racine: true
formulaire:
    page0:
        url:
            name: 'URL de base des webservices'
            commentaire: 'Exemple: https://asalae.libriciel.fr/restservices'
        login:
            name: 'Identifiant de connexion'
        password:
            name: 'Mot de passe'
            type: password
        chunk_size_in_bytes:
            name: 'Taille maximum des blocs a envoyer (en octets)'
            commentaire: "asalae ne prend pas les pièces de plus de 2Mo. 2097152 (valeur par défaut) indique un envoi par bloc de 2Mo maximum."
            default: 2097152

action:
    ping:
        name: 'Tester la connexion (réseau)'
        action-class: AsalaeRestPing
    version:
        name: 'Tester la connexion (authentification)'
        action-class: AsalaeRestVersion
