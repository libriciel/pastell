nom: 'Transformation générique'
description: 'Permet de définir une expression twig dont le résultat sera affecté à l''élément associé'
type: transformation
formulaire:
    page0:
        definition:
            name: "Définition de l'extraction"
            read-only: true
            type: file
            visionneuse: TransformationGeneriqueVisionneuse
        fill-data:
            name: "Définition de l'extraction"
            edit-only: true
            type: externalData
            link_name: 'Décrire les transformations'
            choice-action: fill-data
        data:
            name: 'Fichier de configuration'
            commentaire: "Format JSON ou XML (identifiant: pa_connector_data)<br />
            Les données de ce fichier peuvent être utilisées dans les transformations, exemple :
             {{ jsonpath('pa_connector_data', '$.id') }}"
            type: file
action:
    test_extraction:
        name: 'Tester la transformation'
        action-class: TransformationGeneriqueTestExtraction
    fill-data:
        name: 'Configurer les transformations'
        rule:
            internal-action: true
        action-class: TransformationGeneriqueFillData
