nom: iparapheur rest
type: signature
description: "Connecteur pour le iparapheur de Libriciel (api rest à partir de la V5)"

formulaire:
  page:
    url:
      name: "URL du parapheur"
      commentaire: "Exemple: https://iparapheur.partenaire.libriciel.fr"
    username:
      name: "Nom d'utilisateur"
    password:
      name: "Mot de passe"
      type: password
    tenant_name:
      name: "Nom de l'entité iparapheur"
      type: externalData
      choice-action: tenant-name
      link_name: "Sélectionner l'entité"
    tenant_id:
      name: "Identifiant de l'entité iparapheur"
      no-show: true
    desk_name:
      name: "Nom du bureau iparapheur"
      type: externalData
      choice-action: desk-name
      link_name: "Sélectionner le bureau"
    desk_id:
      name: "Identifiant du bureau iparapheur"
      no-show: true
    iparapheur_type:
      name: "Type iparapheur"
      type: externalData
      choice-action: iparapheur-type
      link_name: "Sélectionner le type"
    iparapheur_type_id:
      name: "Identifiant du type iparapheur"
      no-show: true
    iparapheur_subtype:
      name: "Sous-type iparapheur"
      type: externalData
      choice-action: iparapheur-subtype
      no-show: true

action:
  test-connexion:
    name: "Tester la connexion"
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestTestConnexion
  tenant-name:
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestGetTenantList
    rule:
      internal-action: true
  desk-name:
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestGetDeskList
    rule:
      internal-action: true
  iparapheur-type:
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestGetTypeList
    rule:
      internal-action: true
  iparapheur-subtype:
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestGetSubTypeList
    rule:
      internal-action: true
  display-subtype:
    name: "Voir les sous-types"
    action-class: Pastell\Connector\IparapheurRest\Action\IpRestDisplaySubType

