nom: 'Reprise arriéré actes (TdT versant)'
type: 'Actes administratifs'
description: "Ce type de dossier permet de verser les documents issus d'un Tdt 
  en vu de les envoyer vers un document ls-actes-tdt-versant-sae pour\nversement SEDA"
restriction_pack:
  - suppl_actes_tdt_versant_sae
formulaire:
    Informations:
        titre:
            name: Titre
            title: true
        enveloppe_metier:
            name: 'Enveloppe métier (1-1)'
            type: file
            requis: true
        document:
            name: "Document de l'enveloppe métier (1-1_X)"
            type: file
            multiple: true
            requis: true
        aractes:
            name: "Accusé de réception de l'actes (1-2)"
            type: file
            requis: true
action:
    creation:
        name-action: Créer
        name: Créé
        rule:
            no-last-action: ''
    modification:
        name-action: Modifier
        name: 'En cours de rédaction'
        rule:
            last-action:
                - creation
                - modification
                - importation
                - erreur
    supression:
      name-action: Supprimer
      name: Supprimé
      action-class: Supprimer
      warning: 'Êtes-vous sûr ?'
    importation:
        name: 'Importation du document'
        rule:
          role_id_e: no-role
        action-automatique: create-acte
    create-acte:
        name-action: "Créer l'acte"
        name: 'Acte créé'
        rule:
          document_is_valide: true
          last-action:
            - creation
            - modification
            - importation
        action-class: ActesPreversementSEDACreate
        action-automatique: termine
    erreur:
        name: "Erreur lors de l'import"
        rule:
            role_id_e: no-role
    termine:
      name: 'Traitement terminé'
      rule:
        role_id_e: no-role
