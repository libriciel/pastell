nom: 'Récupération arriéré PES s2low'
type: Finances
description: ''
connecteur:
    - recup-pes-s2low
    - 'Bordereau SEDA'
    - SAE
    - recup-pes-s2low
affiche_one: false
formulaire:
    Informations:
        transaction_id:
            name: 'Identifiant de transaction'
            type: text
            requis: true
            multiple: false
            commentaire: ''
            index: true
        objet:
            name: Objet
            type: text
            requis: true
            multiple: false
            commentaire: ''
            title: true
        fichier_pes:
            name: 'Fichier PES'
            type: file
            requis: true
            multiple: false
            commentaire: ''
            content-type: application/xml
        pes_acquit:
            name: 'PES Acquit'
            type: file
            requis: true
            multiple: false
            commentaire: ''
    Cheminement:
        envoi_update_status_pes_s2low_1:
            name: 'Mise à jour du statut de la transaction PES sur s2low #1'
            type: checkbox
            onchange: cheminement-change
            default: checked
            read-only: false
        envoi_sae:
            name: "Système d'archivage électronique"
            type: checkbox
            onchange: cheminement-change
            default: checked
            read-only: false
        envoi_transformation_fixe:
            name: 'Transformation Fixe'
            type: checkbox
            onchange: cheminement-change
            default: checked
            read-only: false
        envoi_update_status_pes_s2low_2:
            name: 'Mise à jour du statut de la transaction PES sur s2low #2'
            type: checkbox
            onchange: cheminement-change
            default: checked
            read-only: false
    'Statut s2low #1':
        update_status_pes_s2low_status_1:
            name: 'Statut de la transaction'
    SAE:
        sae_show:
            no-show: true
        journal:
            name: 'Faisceau de preuves'
            type: file
        date_journal_debut:
            name: 'Date du premier évènement journalisé'
        date_cloture_journal:
            name: 'Date de clôture du journal'
        date_cloture_journal_iso8601:
            name: 'Date de clôture du journal (iso 8601)'
        sae_transfert_id:
            name: 'Identifiant de transfert'
            index: true
        sae_bordereau:
            name: 'Bordereau SEDA'
            type: file
        sae_archive:
            name: "Paquet d'archive (SIP)"
            type: file
        ar_sae:
            type: file
            name: 'Accusé de réception SAE'
        sae_ack_comment:
            name: "Commentaire de l'accusé de réception"
        reply_sae:
            type: file
            name: 'Réponse du SAE'
        sae_archival_identifier:
            name: "Identifiant de l'archive sur le SAE"
        sae_atr_comment:
            name: 'Commentaire de la réponse du SAE'
    'Transformation Fixe':
        has_transformation_fixe:
            no-show: true
            read-only: true
        transformation_fixe_file:
            name: Transformations
            type: file
            visionneuse: Pastell\Viewer\JsonViewer
            read-only: true
            visionneuse-no-link: true
    'Statut s2low #2':
        update_status_pes_s2low_status_2:
            name: 'Statut de la transaction'
champs-affiches:
    - titre
    - dernier_etat
    - date_dernier_etat
champs-recherche-avancee:
    - type
    - id_e
    - lastetat
    - last_state_begin
    - etatTransit
    - state_begin
    - notEtatTransit
    - search
    - transaction_id
page-condition:
    'Statut s2low #1':
        envoi_update_status_pes_s2low_1: true
    SAE:
        sae_show: true
    'Transformation Fixe':
        has_transformation_fixe: true
    'Statut s2low #2':
        envoi_update_status_pes_s2low_2: true
action:
    creation:
        name-action: Créer
        name: Créé
        rule:
            no-last-action: ''
    modification:
        name-action: Modifier
        name: 'En cours de rédaction'
        rule:
            last-action:
                - creation
                - modification
                - importation
                - change-status-transaction_1
                - accepter-sae
                - transformation-fixe
    supression:
        name-action: Supprimer
        name: Supprimé
        rule:
            last-action:
                - creation
                - modification
                - importation
                - termine
                - fatal-error
                - change-status-error_1
                - rejet-sae
                - erreur-envoie-sae
                - transformation-fixe-error
                - change-status-error_2
        action-class: Supprimer
        warning: 'Êtes-vous sûr ?'
    importation:
        name: 'Importation du document'
        rule:
            role_id_e: no-role
        action-automatique: orientation
    orientation:
        name: 'Envoi du document'
        name-action: 'Envoyer le document'
        rule:
            last-action:
                - creation
                - modification
                - importation
                - change-status-transaction_1
                - accepter-sae
                - transformation-fixe
                - change-status-transaction_2
                - rejet-sae
            document_is_valide: true
        action-class: OrientationTypeDossierPersonnalise
    termine:
        name: 'Traitement terminé'
        rule:
            role_id_e: no-role
    reouverture:
        name: 'Rouvrir le dossier'
        rule:
            last-action:
                - termine
        action-class: Reopen
    cheminement-change:
        no-workflow: true
        rule:
            role_id_e: 'no-role,'
        action-class: CheminementChangeTypeDossierPersonnalise
    preparation-change-status-transaction_1:
        name: 'Préparation du changement de statut de la transaction #1'
        rule:
            role_id_e: no-role
        action-automatique: change-status-transaction_1
        num-same-connecteur: '0'
    change-status-transaction_1:
        name-action: 'Changer le statut de la transaction sur s2low #1'
        name: 'Statut de la transaction changé #1'
        rule:
            last-action:
                - preparation-change-status-transaction_1
                - change-status-error_1
        action-class: StandardAction
        connecteur-type: TdT
        connecteur-type-action: Pastell\Step\UpdateStatusPesS2low\Action\ChangeStatusAction
        connecteur-type-mapping:
            status: update_status_pes_s2low_status_1
            change-status-error: change-status-error_1
            transaction: transaction_id
        action-automatique: orientation
        num-same-connecteur: '0'
        editable-content:
            - envoi_sae
            - envoi_transformation_fixe
            - envoi_update_status_pes_s2low_2
            - sae_show
            - journal
            - date_journal_debut
            - date_cloture_journal
            - date_cloture_journal_iso8601
            - sae_transfert_id
            - sae_bordereau
            - sae_archive
            - ar_sae
            - sae_ack_comment
            - reply_sae
            - sae_archival_identifier
            - sae_atr_comment
            - update_status_pes_s2low_status_2
        modification-no-change-etat: true
    change-status-error_1:
        name: 'Erreur lors du changement de statut de la transaction #1'
        rule:
            role_id_e: no-role
        num-same-connecteur: '0'
    preparation-send-sae:
        name: "Préparation de l'envoi au SAE"
        rule:
            role_id_e: no-role
        action-automatique: generate-sip
    generate-sip:
        name-action: "Générer le paquet d'archive (SIP)"
        name: "Paquet d'archive (SIP) généré"
        rule:
            last-action:
                - preparation-send-sae
                - generate-sip-error
                - rejet-sae
                - erreur-envoie-sae
        action-class: StandardAction
        connecteur-type: SAE
        connecteur-type-action: Pastell\Step\SAE\Action\SAEGenerateArchiveAction
        action-automatique: send-archive
        connecteur-type-mapping:
            generate-sip-error: generate-sip-error
            sae_show: sae_show
            sae_bordereau: sae_bordereau
            sae_archive: sae_archive
            journal: journal
            date_journal_debut: date_journal_debut
            date_cloture_journal: date_cloture_journal
            date_cloture_journal_iso8601: date_cloture_journal_iso8601
    generate-sip-error:
        name: "Erreur lors de la génération de l'archive"
        rule:
            role_id_e: no-role
    send-archive:
        name-action: 'Verser au SAE'
        name: 'Versé au SAE'
        rule:
            last-action:
                - generate-sip
                - rejet-sae
                - erreur-envoie-sae
        action-class: StandardAction
        connecteur-type: SAE
        connecteur-type-action: Pastell\Step\SAE\Action\SAESendArchiveAction
        action-automatique: verif-sae
        connecteur-type-mapping:
            sae_transfert_id: sae_transfert_id
            sae_bordereau: sae_bordereau
            sae_archive: sae_archive
            erreur-envoie-sae: erreur-envoie-sae
    erreur-envoie-sae:
        name: "Erreur lors de l'envoi au SAE"
        rule:
            role_id_e: no-role
    verif-sae:
        name-action: "Récupérer l'AR du dossier sur le SAE"
        name: "Récuperation de l'AR sur le SAE"
        rule:
            last-action:
                - send-archive
                - verif-sae-erreur
        action-class: StandardAction
        connecteur-type: SAE
        connecteur-type-action: SAEVerifier
        connecteur-type-mapping:
            sae_transfert_id: sae_transfert_id
            ar_sae: ar_sae
            ar-recu-sae: ar-recu-sae
            verif-sae-erreur: verif-sae-erreur
            sae_ack_comment: sae_ack_comment
            sae_bordereau: sae_bordereau
            ack-not-provided: ack-not-provided
    verif-sae-erreur:
        name: "Erreur lors de la récupération de l'AR"
        rule:
            role_id_e: no-role
    ar-recu-sae:
        name: 'AR SAE reçu'
        rule:
            role_id_e: no-role
        action-automatique: validation-sae
    ack-not-provided:
        name: 'En attente de la validation par le SAE'
        rule:
            role_id_e: no-role
        action-automatique: validation-sae
    validation-sae:
        name-action: "Vérifier l'acceptation par le SAE"
        name: "Vérification de l'acceptation par le SAE"
        rule:
            last-action:
                - ar-recu-sae
                - ack-not-provided
                - validation-sae-erreur
        action-class: StandardAction
        connecteur-type: SAE
        connecteur-type-action: SAEValider
        connecteur-type-mapping:
            sae_transfert_id: sae_transfert_id
            reply_sae: reply_sae
            erreur-envoie-sae: erreur-envoie-sae
            validation-sae-erreur: validation-sae-erreur
            accepter-sae: accepter-sae
            rejet-sae: rejet-sae
            sae_atr_comment: sae_atr_comment
            sae_archival_identifier: sae_archival_identifier
            sae_bordereau: sae_bordereau
    validation-sae-erreur:
        name: 'Erreur lors de la vérification de la validité du transfert'
        rule:
            role_id_e: no-role
    accepter-sae:
        name: 'Transfert accepté par le SAE'
        rule:
            role_id_e: no-role
        action-automatique: orientation
        editable-content:
            - envoi_transformation_fixe
            - envoi_update_status_pes_s2low_2
            - update_status_pes_s2low_status_2
        modification-no-change-etat: true
    rejet-sae:
        name: 'Transfert rejeté par le SAE'
        rule:
            role_id_e: no-role
        action-automatique: orientation
    preparation-transformation-fixe:
        name: 'Préparation à la transformation fixe'
        rule:
            role_id_e: no-role
        action-automatique: transformation-fixe
    transformation-fixe:
        name: 'Transformation fixe du dossier'
        rule:
            last-action:
                - preparation-transformation-fixe
                - transformation-fixe-error
        action-class: StandardAction
        action-automatique: orientation
        connecteur-type: transformation
        connecteur-type-action: TransformationFixeTransform
        connecteur-type-mapping:
            transformation_fixe_file: transformation_fixe_file
            has_transformation_fixe: has_transformation_fixe
            transformation-fixe-error: transformation-fixe-error
        editable-content:
            - envoi_update_status_pes_s2low_2
            - update_status_pes_s2low_status_2
        modification-no-change-etat: true
        transformations:
            update_status_pes_s2low_status_2: "{%if sae_atr_comment matches '/(.*)Archive refusée(.*)/' %}20{% else %}10{% endif %}"
    transformation-fixe-error:
        name: 'Erreur lors de la transformation fixe du dossier'
        rule:
            role_id_e: no-role
    preparation-change-status-transaction_2:
        name: 'Préparation du changement de statut de la transaction #2'
        rule:
            role_id_e: no-role
        action-automatique: change-status-transaction_2
        num-same-connecteur: '1'
    change-status-transaction_2:
        name-action: 'Changer le statut de la transaction sur s2low #2'
        name: 'Statut de la transaction changé #2'
        rule:
            last-action:
                - preparation-change-status-transaction_2
                - change-status-error_2
        action-class: StandardAction
        connecteur-type: TdT
        connecteur-type-action: Pastell\Step\UpdateStatusPesS2low\Action\ChangeStatusAction
        connecteur-type-mapping:
            status: update_status_pes_s2low_status_2
            change-status-error: change-status-error_2
            transaction: transaction_id
        action-automatique: orientation
        num-same-connecteur: '1'
    change-status-error_2:
        name: 'Erreur lors du changement de statut de la transaction #2'
        rule:
            role_id_e: no-role
        num-same-connecteur: '1'
restriction_pack:
    - suppl_recup_pes_s2low
studio_definition: 
