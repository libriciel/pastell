libelle: 'Mise à jour du status de la transaction sur s2low'
restriction_pack :
    - 'suppl_test'
connecteur_type:
    - recup-actes-s2low

configuration_etape_formulaire:
    transaction:
        name: 'Identifiant de la transaction'
        requis: true
        type: text_select

formulaire:
    Status s2low:
        update_status_actes_s2low_status:
            name: 'Status de la transaction'
page-condition:
    'Status s2low':
        envoi_update_status_actes_s2low: true

action:
    preparation-change-status-transaction:
        name: "Préparation du changement de status de la transaction"
        rule:
            role_id_e: no-role
        action-automatique: change-status-transaction
    change-status-transaction:
        name-action: 'Changer le status de la transaction sur s2low'
        name: 'Status de la transaction changé'
        rule:
            last-action:
                - preparation-change-status-transaction
        action-class: StandardAction
        connecteur-type: TdT
        connecteur-type-action: Pastell\Step\UpdateStatusActesS2low\Action\ChangeStatusAction
        connecteur-type-mapping:
            status: update_status_actes_s2low_status
        action-automatique: orientation
